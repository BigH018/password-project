[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vaultkeeper"
version = "0.1.0"
description = "Local-only, offline password manager organized around game accounts."
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
vaultkeeper = "vaultkeeper.main:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-m \"not slow\""
markers = [
    "slow: uses production KDF parameters (run with -m slow)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert and obviously fake hard-coded passwords by design.
"tests/**" = ["S101", "S105", "S106", "S107"]
